name: Android test only
on:
  push:
    branches: [ci-android-toolchain]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/ci-android-toolchain'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - name: Report resolved dependency graphs
        run: |
          ./gradlew --no-daemon buildEnvironment
          ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath
          ./gradlew --no-daemon :app:dependencies --configuration debugUnitTestRuntimeClasspath
          ./gradlew --no-daemon :app:dependencies --configuration debugAndroidTestRuntimeClasspath
      - name: Check merged manifest SDK floor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifests = list(Path('app/build/intermediates/merged_manifests/debug').rglob('AndroidManifest.xml'))
          if len(manifests) != 1:
              raise SystemExit(f'Expected one merged debug manifest, found {len(manifests)}')
          sdk = ET.parse(manifests[0]).getroot().find('uses-sdk')
          namespace = '{http://schemas.android.com/apk/res/android}'
          if sdk is None or sdk.get(namespace + 'minSdkVersion') != '24':
              raise SystemExit('Unexpected merged minSdkVersion')
          print('Merged debug manifest minSdkVersion=24')
          PY
  device:
    if: github.ref == 'refs/heads/ci-android-toolchain'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: ['24', '37.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Enable virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          script: ./gradlew --no-daemon connectedDebugAndroidTest
