name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/materialclass-debug.jks"
          chmod 600 "$RUNNER_TEMP/materialclass-debug.jks"

      - name: Run unit tests, lint, and debug build
        env:
          ANDROID_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/materialclass-debug.jks
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      - name: Verify debug APK signature
        if: success()
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-verification-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: materialclass-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
