name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  prepare-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle and warm cache
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare shared CI metadata
        run: |
          mkdir -p .ci/prepared
          printf 'source_sha=%s\nref=%s\nbuild_type=debug\n' \
            "$SOURCE_SHA" "$GITHUB_REF" > .ci/prepared/build-metadata.txt

      - name: Upload prepared inputs
        uses: actions/upload-artifact@v6
        with:
          name: debug-prepared-inputs
          path: .ci/prepared
          if-no-files-found: error
          retention-days: 1

  debug-unit-tests:
    needs: prepare-debug
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Download prepared inputs
        uses: actions/download-artifact@v6
        with:
          name: debug-prepared-inputs
          path: .ci/prepared

      - name: Verify prepared source
        run: test "$(sed -n 's/^source_sha=//p' .ci/prepared/build-metadata.txt)" = "$SOURCE_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run debug unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debug-unit-test-reports
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: warn
          retention-days: 7

  debug-lint:
    needs: prepare-debug
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Download prepared inputs
        uses: actions/download-artifact@v6
        with:
          name: debug-prepared-inputs
          path: .ci/prepared

      - name: Verify prepared source
        run: test "$(sed -n 's/^source_sha=//p' .ci/prepared/build-metadata.txt)" = "$SOURCE_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run debug lint
        run: ./gradlew --no-daemon lintDebug

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debug-lint-reports
          path: app/build/reports
          if-no-files-found: warn
          retention-days: 7

  debug-apk:
    needs: prepare-debug
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Download prepared inputs
        uses: actions/download-artifact@v6
        with:
          name: debug-prepared-inputs
          path: .ci/prepared

      - name: Verify prepared source
        run: test "$(sed -n 's/^source_sha=//p' .ci/prepared/build-metadata.txt)" = "$SOURCE_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/materialclass-debug.jks"
          chmod 600 "$RUNNER_TEMP/materialclass-debug.jks"

      - name: Build signed debug APK
        env:
          ANDROID_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/materialclass-debug.jks
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify debug APK signature
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          test ! -e app/build/outputs/apk/debug/app-debug-unsigned.apk
          "$apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: materialclass-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  navigation-instrumentation:
    needs: prepare-debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run navigation instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=org.materialclass.ui.MaterialClassNavigationTest#predictiveProgressRevealsThePreviousScreenWithoutTintingIt,org.materialclass.ui.MaterialClassNavigationTest#openingSecondaryScreenStartsAtRightEdge,org.materialclass.ui.MaterialClassNavigationTest#previousScreenEffectDoesNotRestartWhenOpeningDetail,org.materialclass.ui.MaterialClassNavigationTest#returningToPreviousScreenDoesNotRestartItsEffect,org.materialclass.ui.MaterialClassNavigationTest#cancelledEdgeSwipeKeepsDetailAndShowsPreviousDuringDrag,org.materialclass.ui.MaterialClassNavigationTest#completedEdgeSwipeReturnsToPreviousScreen,org.materialclass.notifications.NotificationStateStoreTest,org.materialclass.notifications.NotificationWorkManagerTest
      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: navigation-instrumentation-results
          path: app/build/outputs/androidTest-results
          if-no-files-found: warn

  workmanager-recovery:
    needs: prepare-debug
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify process recovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: bash .github/scripts/workmanager-recovery.sh
      - name: Upload recovery report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: workmanager-recovery-report
          path: app/build/recovery-report
          if-no-files-found: warn

  merge-to-main:
    needs:
      - debug-unit-tests
      - debug-lint
      - debug-apk
      - navigation-instrumentation
      - workmanager-recovery
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref != 'main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge pull request into main
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --squash --delete-branch --repo "$GITHUB_REPOSITORY"
