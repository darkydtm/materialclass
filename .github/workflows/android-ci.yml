name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests, lint, and debug build
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      - name: Run connected debug tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: ./gradlew --no-daemon connectedDebugAndroidTest
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-verification-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: materialclass-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
