name: Android Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-build
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.sha }}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle and warm cache
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare shared release metadata
        run: |
          mkdir -p .ci/prepared
          printf 'source_sha=%s\nref=%s\nbuild_type=release\n' \
            "$SOURCE_SHA" "$GITHUB_REF" > .ci/prepared/release-metadata.txt

      - name: Upload prepared inputs
        uses: actions/upload-artifact@v6
        with:
          name: release-prepared-inputs
          path: .ci/prepared
          if-no-files-found: error
          retention-days: 1

  release-build:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Download prepared inputs
        uses: actions/download-artifact@v6
        with:
          name: release-prepared-inputs
          path: .ci/prepared

      - name: Verify prepared source
        run: test "$(sed -n 's/^source_sha=//p' .ci/prepared/release-metadata.txt)" = "$SOURCE_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/materialclass-release.jks"
          chmod 600 "$RUNNER_TEMP/materialclass-release.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/materialclass-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify release APK signature
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          test ! -e app/build/outputs/apk/release/app-release-unsigned.apk
          "$apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Create release checksum
        run: sha256sum app/build/outputs/apk/release/app-release.apk > app-release.apk.sha256

      - name: Upload release candidate
        uses: actions/upload-artifact@v6
        with:
          name: materialclass-release-candidate
          path: |
            app/build/outputs/apk/release/app-release.apk
            app-release.apk.sha256
            .ci/prepared/release-metadata.txt
          if-no-files-found: error
          retention-days: 1

  release-verify:
    needs: release-build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Download release candidate
        uses: actions/download-artifact@v6
        with:
          name: materialclass-release-candidate
          path: release-output

      - name: Verify release candidate provenance
        run: |
          test "$(sed -n 's/^source_sha=//p' release-output/.ci/prepared/release-metadata.txt)" = "$SOURCE_SHA"
          (cd release-output && sha256sum -c app-release.apk.sha256)

      - name: Verify release APK signature
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs release-output/app/build/outputs/apk/release/app-release.apk

      - name: Upload verified release APK
        uses: actions/upload-artifact@v6
        with:
          name: materialclass-release-apk
          path: |
            release-output/app/build/outputs/apk/release/app-release.apk
            release-output/app-release.apk.sha256
            release-output/.ci/prepared/release-metadata.txt
          if-no-files-found: error
          retention-days: 30
