name: Integrated privacy revocation regressions
on:
  push:
    branches: [test/privacy-integrated-red, test/privacy-profile-incomplete, fix/privacy-data-guard, fix/privacy-schedule-registry, feat/privacy-integrate-diary-schedule, feat/privacy-integrate-login]
permissions:
  contents: read
jobs:
  atomic-state:
    if: github.ref == 'refs/heads/test/privacy-profile-incomplete' || github.ref == 'refs/heads/test/privacy-integrated-red' || github.ref == 'refs/heads/fix/privacy-data-guard' || github.ref == 'refs/heads/fix/privacy-schedule-registry' || github.ref == 'refs/heads/feat/privacy-integrate-diary-schedule' || github.ref == 'refs/heads/feat/privacy-integrate-login'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: ./gradlew --no-daemon testDebugUnitTest --tests org.materialclass.session.AtomicPrivateStateTest
      - run: ./gradlew --no-daemon testDebugUnitTest
  device:
    if: github.ref == 'refs/heads/test/privacy-integrated-red' || github.ref == 'refs/heads/test/privacy-profile-incomplete' || github.ref == 'refs/heads/fix/privacy-data-guard' || github.ref == 'refs/heads/fix/privacy-schedule-registry' || github.ref == 'refs/heads/feat/privacy-integrate-diary-schedule' || github.ref == 'refs/heads/feat/privacy-integrate-login'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: ['24', '37.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Enable virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          script: >-
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class='org.materialclass.GradesDiaryRaceTest#incompleteProfileClearsPrivateSchoolPayload,org.materialclass.GradesDiaryRaceTest#contextMismatchClearsPrivateDataAndStopsSchoolCalls,org.materialclass.GradesDiaryRaceTest#replacedAccountProfileCommitIsDiscarded,org.materialclass.GradesDiaryRaceTest#refreshedProfileIsCommittedToRegistryAndVisible,org.materialclass.GradesDiaryRaceTest#onlineScheduleIsCommittedToRegistryAndVisible,org.materialclass.GradesDiaryRaceTest#twoControllersDoNotShareDiaryOrWeeksState,org.materialclass.GradesDiaryRaceTest#accountSwitchClearsDiaryWeeksAndSelectedDateOnOldController,org.materialclass.GradesDiaryRaceTest#invalidationOnlyCallbackGetterSeesUpdatedDiaryAndWeeks,org.materialclass.GradesDiaryRaceTest#concurrentLoginCancelsPendingGradesWithoutLeavingLoading,org.materialclass.GradesDiaryRaceTest#revokedStateIsClearedBeforeBlockedUiCommitResumes,org.materialclass.GradesDiaryRaceTest#revokedOnlineGradesAreNotPublished,org.materialclass.GradesDiaryRaceTest#revokedLoginPublication,org.materialclass.GradesDiaryRaceTest#revokedProfilePublication,org.materialclass.GradesDiaryRaceTest#revokedWeeksPublication,org.materialclass.GradesDiaryRaceTest#revokedDiaryPublication,org.materialclass.GradesDiaryRaceTest#revokedSchedulePublication,org.materialclass.GradesDiaryRaceTest#missingRegistryEntryCannotExposePrivateSnapshot,org.materialclass.GradesDiaryRaceTest#closedControllerCannotExposePrivateSnapshotAfterUnregister,org.materialclass.GradesDiaryRaceTest#onlineScheduleFailureIsVisibleThroughPrivateStateAndNotification,org.materialclass.GradesDiaryRaceTest#missingRegistrySanitizesScheduleErrorWithoutStaleLocalError,org.materialclass.GradesDiaryRaceTest#loginBusyRemainsVisibleWhilePrivateRegistryIsStillEmpty,org.materialclass.GradesDiaryRaceTest#accountSwitchClearsScheduleErrorFromOldController,org.materialclass.GradesDiaryRaceTest#invalidationCallbackReadsSanitizedStateAfterRegistryRevocation,org.materialclass.GradesDiaryRaceTest#replacedAccountProfilePublication,org.materialclass.GradesDiaryRaceTest#replacedAccountDiaryPublication,org.materialclass.GradesDiaryRaceTest#replacedAccountSchedulePublication'
