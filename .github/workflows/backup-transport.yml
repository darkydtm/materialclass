name: Isolated local backup transport
on:
  push:
    branches: [test/backup-transport, test/backup-no-backup-control]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    if: github.ref == 'refs/heads/test/backup-transport' || github.ref == 'refs/heads/test/backup-no-backup-control'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: ['24', '37.0']
        target: [default, google_apis]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Test bmgr output parser
        run: python3 -m unittest discover -s .github/scripts -p test_bmgr_output.py -v
      - name: Build isolated APKs
        run: |
          set -eu
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :backup-reference:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/normal.apk"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/normal-test.apk"
          ./gradlew --no-daemon -PbackupRulesProbe=true :app:assembleDebug :app:assembleDebugAndroidTest
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/probe.apk"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/probe-test.apk"
          python3 .github/scripts/check-backup-probe.py
      - name: Enable virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise local transport
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          script: bash .github/backup-transport.sh
