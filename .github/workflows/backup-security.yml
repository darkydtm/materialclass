name: Backup security audit
on:
  push:
    branches: [feat/integrate-backup-cleanup, feat/integrate-restart-ui, feat/integrate-network-contract]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: github.ref == 'refs/heads/feat/integrate-network-contract' || github.ref == 'refs/heads/feat/integrate-restart-ui' || github.ref == 'refs/heads/feat/integrate-backup-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Test backup audit
        run: python3 -m unittest discover -s .github/scripts -p 'test_backup_security.py' -v
      - run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Verify packaged backup rules
        run: |
          set -eu
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -name apkanalyzer -type f | sort -V | tail -1)"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)"
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > "$RUNNER_TEMP/manifest-tree.txt"
          "$AAPT2" dump resources "$APK" > "$RUNNER_TEMP/resources.txt"
          "$APKANALYZER" manifest print "$APK" > "$RUNNER_TEMP/manifest.xml"
          "$APKANALYZER" resources xml --file /res/xml/backup_rules.xml "$APK" > "$RUNNER_TEMP/backup_rules.xml"
          "$APKANALYZER" resources xml --file /res/xml/data_extraction_rules.xml "$APK" > "$RUNNER_TEMP/data_extraction_rules.xml"
          python3 .github/scripts/check-backup-security.py "$RUNNER_TEMP"
          mkdir artifact
          cp "$APK" artifact/materialclass-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk artifact/materialclass-androidTest.apk
          (cd artifact && sha256sum materialclass-debug.apk materialclass-androidTest.apk | tee SHA256SUMS)
          printf 'commit=%s\n' "$GITHUB_SHA" > artifact/metadata.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backup-audit-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 3
  artifact-device:
    if: github.ref == 'refs/heads/feat/integrate-network-contract' || github.ref == 'refs/heads/feat/integrate-restart-ui' || github.ref == 'refs/heads/feat/integrate-backup-cleanup'
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: ['24', '37.0']
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: backup-audit-debug-apk
          path: artifact
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Inspect downloaded artifact
        run: |
          set -eu
          test "$(find artifact -maxdepth 1 -type f | wc -l)" -eq 4
          (cd artifact && sha256sum -c SHA256SUMS)
          grep -Fx "commit=$GITHUB_SHA" artifact/metadata.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -name apkanalyzer -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs artifact/materialclass-debug.apk
          test "$("$APKANALYZER" manifest application-id artifact/materialclass-debug.apk)" = org.materialclass
          test "$("$APKANALYZER" manifest min-sdk artifact/materialclass-debug.apk)" = 24
          test "$("$APKANALYZER" manifest debuggable artifact/materialclass-debug.apk)" = true
      - name: Enable virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch downloaded artifact
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          script: |
            set -eu
            (cd artifact && sha256sum -c SHA256SUMS)
            adb install artifact/materialclass-debug.apk
            adb install artifact/materialclass-androidTest.apk
            adb shell am instrument -w -r -e class org.materialclass.security.BackupRulesTest org.materialclass.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/backup-instrumentation.txt"
            cat "$RUNNER_TEMP/backup-instrumentation.txt"
            grep -Eq '^OK \(1 test\)' "$RUNNER_TEMP/backup-instrumentation.txt"
            adb shell monkey -p org.materialclass -c android.intent.category.LAUNCHER 1
            for attempt in $(seq 1 30); do if adb shell pidof org.materialclass; then break; fi; test "$attempt" -lt 30; sleep 1; done
            (cd artifact && sha256sum -c SHA256SUMS)
