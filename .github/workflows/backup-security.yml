name: Backup security audit
on:
  push:
    branches: [test/backup-security]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: github.ref == 'refs/heads/test/backup-security'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: ./gradlew --no-daemon assembleDebug
      - name: Verify packaged backup rules
        run: |
          set -eu
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -name apkanalyzer -type f | sort -V | tail -1)"
          "$APKANALYZER" manifest print "$APK" > "$RUNNER_TEMP/manifest.xml"
          "$APKANALYZER" resources xml --file /res/xml/backup_rules.xml "$APK" > "$RUNNER_TEMP/backup_rules.xml"
          "$APKANALYZER" resources xml --file /res/xml/data_extraction_rules.xml "$APK" > "$RUNNER_TEMP/data_extraction_rules.xml"
          python3 .github/scripts/check-backup-security.py "$RUNNER_TEMP"
          mkdir artifact
          cp "$APK" artifact/materialclass-debug.apk
          (cd artifact && sha256sum materialclass-debug.apk | tee SHA256SUMS)
          printf 'commit=%s\n' "$GITHUB_SHA" > artifact/metadata.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backup-audit-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 3
