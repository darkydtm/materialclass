name: Private store spike
on:
  push:
    branches: [test/ui-privacy-design, test/privacy-actor-spike]
permissions:
  contents: read
jobs:
  test:
    if: github.ref == 'refs/heads/test/ui-privacy-design' || github.ref == 'refs/heads/test/privacy-actor-spike'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - if: github.ref == 'refs/heads/test/ui-privacy-design'
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests org.materialclass.PrivateStoreSpikeTest
      - if: github.ref == 'refs/heads/test/privacy-actor-spike'
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests org.materialclass.PrivacyActorSpikeTest
