name: Privacy snapshot experiment
on:
  push:
    branches: [test/privacy-snapshot-experiment]
permissions:
  contents: read
jobs:
  experiment:
    if: github.ref == 'refs/heads/test/privacy-snapshot-experiment'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Run snapshot experiment
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest --tests org.materialclass.PrivacySnapshotExperimentTest
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          paths = glob.glob('app/build/test-results/testDebugUnitTest/TEST-org.materialclass.PrivacySnapshotExperimentTest.xml')
          assert len(paths) == 1, paths
          suite = ET.parse(paths[0]).getroot()
          expected = {'concurrentPublishCannotApplyAfterCompletedRevoke', 'identicalConcurrentWritesAreEquivalentEvenWithoutMerge', 'revokeWinsAgainstBothControllers', 'publishWinsThenRevokeRetriesWithoutRestoringPayload', 'accountAbaRejectsOldSnapshotAndEpoch', 'equivalentWritesDoNotConflictButChangedEpochDoes', 'cancellationCompletesWhileApplyObserverBlocks', 'observerFailureCanFollowCommittedApply', 'cancellationPrecedesSnapshotApplyAndDoesNotItselfClearUi'}
          actual = {case.get('name') for case in suite.findall('testcase') if case.find('failure') is None and case.find('error') is None and case.find('skipped') is None}
          assert actual == expected, (actual, expected)
          print('All named snapshot experiment tests passed:', sorted(actual))
          PY
